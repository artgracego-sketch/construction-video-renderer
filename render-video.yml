name: Render 9:16 Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: FFmpeg Render
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          uname -a
          ffmpeg -version | head -n 5

      - name: Verify input files
        run: |
          test -f input/photo.png
          test -f input/narration.wav
          test -f input/subtitle.srt

      - name: Render MP4
        run: |
          python3 renderer/render_video.py

      - name: Inspect output
        run: |
          test -f output/output.mp4

          ffprobe \
            -v error \
            -show_entries \
            stream=codec_name,width,height,r_frame_rate \
            -show_entries \
            format=duration \
            -of default=noprint_wrappers=1 \
            output/output.mp4

      - name: Upload test video artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: output/output.mp4
          retention-days: 1
