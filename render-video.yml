name: Render 9:16 Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: FFmpeg Render
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install imageio-ffmpeg

      - name: Verify FFmpeg binary
        run: |
          python - <<'PY'
          import imageio_ffmpeg

          path = imageio_ffmpeg.get_ffmpeg_exe()

          print("FFmpeg executable:")
          print(path)

          print()
          print("FFmpeg version:")

          import subprocess

          result = subprocess.run(
              [path, "-version"],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              check=True,
          )

          print(
              result.stdout.splitlines()[0]
          )
          PY

      - name: Show repository files
        run: |
          set -euxo pipefail

          echo "=== Repository ==="
          find . -maxdepth 3 -type f | sort

          echo
          echo "=== Input ==="
          ls -lah input

          echo
          echo "=== Renderer ==="
          ls -lah renderer

      - name: Verify input files
        run: |
          set -euxo pipefail

          test -f input/photo.png
          test -f input/narration.wav
          test -f input/subtitle.srt

          echo "All input files exist."

      - name: Inspect input files
        run: |
          set -euxo pipefail

          echo "=== Image ==="
          file input/photo.png

          echo
          echo "=== Audio ==="
          file input/narration.wav

          echo
          echo "=== Subtitle ==="
          file input/subtitle.srt

      - name: FFmpeg Render
        run: |
          set -euxo pipefail

          python3 renderer/render_video.py

      - name: Inspect output
        run: |
          set -euxo pipefail

          test -f output/output.mp4

          ls -lh output/output.mp4

          echo
          echo "=== Video probe ==="

          python - <<'PY'
          import imageio_ffmpeg
          import subprocess

          ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()

          probe = ffmpeg.replace(
              "ffmpeg",
              "ffprobe"
          )

          print(
              "FFmpeg:",
              ffmpeg
          )

          print(
              "Note: ffprobe is checked separately if available."
          )
          PY

      - name: Upload test video artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: output/output.mp4
          retention-days: 1
