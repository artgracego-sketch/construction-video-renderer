name: Render 9:16 Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: FFmpeg Render
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Verify FFmpeg
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== FFmpeg path ==="
          command -v ffmpeg

          echo
          echo "=== FFprobe path ==="
          command -v ffprobe

          echo
          echo "=== FFmpeg version ==="
          ffmpeg -version | head -n 5

          echo
          echo "=== FFprobe version ==="
          ffprobe -version | head -n 5

      - name: Show repository files
        run: |
          set -euxo pipefail

          echo "=== Repository ==="
          find . -maxdepth 3 -type f | sort

          echo
          echo "=== Input ==="
          ls -lah input

          echo
          echo "=== Renderer ==="
          ls -lah renderer

      - name: Verify input files
        run: |
          set -euxo pipefail

          test -f input/photo.png
          test -f input/narration.wav
          test -f input/subtitle.srt

          echo "All input files exist."

      - name: Inspect input files
        run: |
          set -euxo pipefail

          echo "=== Image ==="
          file input/photo.png

          echo
          echo "=== Audio ==="
          file input/narration.wav

          echo
          echo "=== Subtitle ==="
          file input/subtitle.srt

          echo
          echo "=== Audio probe ==="
          ffprobe \
            -v error \
            -show_entries \
            stream=codec_name,sample_rate,channels,duration \
            -of default=noprint_wrappers=1 \
            input/narration.wav

      - name: Test FFmpeg directly
        run: |
          set -euxo pipefail

          ffmpeg \
            -hide_banner \
            -loglevel error \
            -f lavfi \
            -i color=c=black:s=320x240:d=1 \
            -f null \
            -

          echo "Direct FFmpeg test succeeded."

      - name: FFmpeg Render
        run: |
          set -euxo pipefail

          python3 renderer/render_video.py

      - name: Inspect output
        run: |
          set -euxo pipefail

          test -f output/output.mp4

          ls -lh output/output.mp4

          echo
          echo "=== Video probe ==="

          ffprobe \
            -v error \
            -show_entries \
            stream=codec_name,width,height,r_frame_rate \
            -show_entries \
            format=duration \
            -of default=noprint_wrappers=1 \
            output/output.mp4

      - name: Upload test video artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: output/output.mp4
          retention-days: 1
