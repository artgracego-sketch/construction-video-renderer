name: Render 9:16 Video

on:
  workflow_dispatch:
    inputs:
      drive_file_name:
        description: "Google Drive file name to download"
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    name: FFmpeg Render
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:

      # ------------------------------------------------------
      # 1. Repository
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7


      # ------------------------------------------------------
      # 2. Python
      # ------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"


      # ------------------------------------------------------
      # 3. Dependencies
      # ------------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install imageio-ffmpeg requests


      # ------------------------------------------------------
      # 4. Syntax check
      # ------------------------------------------------------
      - name: Check Python syntax
        run: |
          set -euxo pipefail

          python3 -m py_compile \
            renderer/render_video.py

          python3 -m py_compile \
            scripts/download_drive_file.py

          python3 -m py_compile \
            scripts/list_drive_files.py

          echo "Python syntax check passed."


      # ------------------------------------------------------
      # 5. OAuth secrets
      # ------------------------------------------------------
      - name: Verify Google OAuth secrets
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euxo pipefail

          test -n "$GOOGLE_CLIENT_ID"
          test -n "$GOOGLE_CLIENT_SECRET"
          test -n "$GOOGLE_REFRESH_TOKEN"

          echo "Google OAuth secrets are available."


      # ------------------------------------------------------
      # 6. Repository structure
      # ------------------------------------------------------
      - name: Show repository files
        run: |
          set -euxo pipefail

          echo "=== Repository ==="
          find . -maxdepth 3 -type f | sort

          echo
          echo "=== Scripts ==="
          ls -lah scripts || true

          echo
          echo "=== Renderer ==="
          ls -lah renderer || true

          echo
          echo "=== Input ==="
          ls -lah input || true


      # ------------------------------------------------------
      # 7. List Google Drive files
      # ------------------------------------------------------
      - name: List Google Drive files
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euxo pipefail

          python3 scripts/list_drive_files.py


      # ------------------------------------------------------
      # 8. Download the requested Google Drive file
      # ------------------------------------------------------
      - name: Download Google Drive input
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FILE_NAME: ${{ inputs.drive_file_name }}
        run: |
          set -euxo pipefail

          python3 scripts/download_drive_file.py


      # ------------------------------------------------------
      # 9. Verify downloaded file
      # ------------------------------------------------------
      - name: Verify downloaded Drive input
        run: |
          set -euxo pipefail

          test -f work/drive_input

          echo "=== Downloaded Drive input ==="
          ls -lh work/drive_input

          echo
          echo "=== File type ==="
          file work/drive_input


      # ------------------------------------------------------
      # 10. Verify required narration and subtitle
      #
      # 現在はNo.15-AのテストWAV/SRTを使用。
      # 次工程でGoogle Driveから実データへ変更する。
      # ------------------------------------------------------
      - name: Verify narration and subtitle
        run: |
          set -euxo pipefail

          test -f input/narration.wav
          test -f input/subtitle.srt

          echo "Narration and subtitle files exist."


      # ------------------------------------------------------
      # 11. Verify FFmpeg
      # ------------------------------------------------------
      - name: Verify FFmpeg binary
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          import subprocess
          import imageio_ffmpeg

          ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()

          print("FFmpeg executable:")
          print(ffmpeg)

          result = subprocess.run(
              [
                  ffmpeg,
                  "-version",
              ],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              check=True,
          )

          print()
          print(result.stdout.splitlines()[0])
          PY


      # ------------------------------------------------------
      # 12. Render
      # ------------------------------------------------------
      - name: FFmpeg Render
        env:
          DRIVE_INPUT_PATH: ${{ github.workspace }}/work/drive_input
        run: |
          set -euxo pipefail

          echo "=== Selected Drive input ==="
          ls -lh "$DRIVE_INPUT_PATH"

          python3 renderer/render_video.py


      # ------------------------------------------------------
      # 13. Inspect output
      # ------------------------------------------------------
      - name: Inspect output
        run: |
          set -euxo pipefail

          test -f output/output.mp4

          echo "=== Output ==="
          ls -lh output/output.mp4

          echo
          echo "=== File type ==="
          file output/output.mp4


      # ------------------------------------------------------
      # 14. Upload MP4
      # ------------------------------------------------------
      - name: Upload rendered video artifact
        uses: actions/upload-artifact@v7
        with:
          name: rendered-video
          path: output/output.mp4
          retention-days: 1
