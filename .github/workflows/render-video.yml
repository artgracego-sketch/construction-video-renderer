name: Render 9:16 Video

on:
  workflow_dispatch:
    inputs:
      drive_file_name:
        description: "Google Drive file name to download"
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    name: FFmpeg Render
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:

      # -------------------------------------------------------
      # 1. Checkout
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7


      # -------------------------------------------------------
      # 2. Python
      # -------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"


      # -------------------------------------------------------
      # 3. Dependencies
      # -------------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install imageio-ffmpeg requests


      # -------------------------------------------------------
      # 4. Syntax check
      # -------------------------------------------------------
      - name: Check Python syntax
        run: |
          set -euxo pipefail

          python3 -m py_compile \
            renderer/render_video.py

          python3 -m py_compile \
            scripts/download_drive_file.py

          python3 -m py_compile \
            scripts/list_drive_files.py

          echo "Python syntax check passed."


      # -------------------------------------------------------
      # 5. OAuth secrets
      # -------------------------------------------------------
      - name: Verify Google OAuth secrets
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euxo pipefail

          test -n "$GOOGLE_CLIENT_ID"
          test -n "$GOOGLE_CLIENT_SECRET"
          test -n "$GOOGLE_REFRESH_TOKEN"

          echo "Google OAuth secrets are available."


      # -------------------------------------------------------
      # 6. Repository information
      # -------------------------------------------------------
      - name: Show repository files
        run: |
          set -euxo pipefail

          echo "=== Repository ==="
          find . -maxdepth 3 -type f | sort

          echo
          echo "=== Scripts ==="
          ls -lah scripts || true

          echo
          echo "=== Renderer ==="
          ls -lah renderer || true

          echo
          echo "=== Local input ==="
          ls -lah input || true


      # -------------------------------------------------------
      # 7. List Google Drive files
      # -------------------------------------------------------
      - name: List Google Drive files
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euxo pipefail

          python3 scripts/list_drive_files.py


      # -------------------------------------------------------
      # 8. Download selected Google Drive file by name
      # -------------------------------------------------------
      - name: Download Google Drive test file
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FILE_NAME: ${{ inputs.drive_file_name }}
        run: |
          set -euxo pipefail

          python3 scripts/download_drive_file.py


      # -------------------------------------------------------
      # 9. Verify downloaded Drive file
      # -------------------------------------------------------
      - name: Check downloaded Drive file
        run: |
          set -euxo pipefail

          test -f work/drive_input

          echo "Downloaded file:"
          ls -lh work/drive_input

          echo
          echo "File type:"
          file work/drive_input


      # -------------------------------------------------------
      # 10. Local test files for No.15-A
      # -------------------------------------------------------
      - name: Verify local video test files
        run: |
          set -euxo pipefail

          test -f input/photo.png
          test -f input/narration.wav
          test -f input/subtitle.srt

          echo "Local video test files exist."


      # -------------------------------------------------------
      # 11. Inspect local files
      # -------------------------------------------------------
      - name: Inspect local input files
        run: |
          set -euxo pipefail

          echo "=== Image ==="
          file input/photo.png

          echo
          echo "=== Audio ==="
          file input/narration.wav

          echo
          echo "=== Subtitle ==="
          file input/subtitle.srt


      # -------------------------------------------------------
      # 12. FFmpeg verification
      # -------------------------------------------------------
      - name: Verify FFmpeg binary
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          import subprocess
          import imageio_ffmpeg

          ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()

          print("FFmpeg executable:")
          print(ffmpeg)

          result = subprocess.run(
              [ffmpeg, "-version"],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              check=True,
          )

          print()
          print(result.stdout.splitlines()[0])
          PY


      # -------------------------------------------------------
      # 13. No.15-A FFmpeg render test
      # -------------------------------------------------------
      - name: FFmpeg Render
        run: |
          set -euxo pipefail

          python3 renderer/render_video.py


      # -------------------------------------------------------
      # 14. Inspect generated MP4
      # -------------------------------------------------------
      - name: Inspect output
        run: |
          set -euxo pipefail

          test -f output/output.mp4

          echo "=== Output file ==="
          ls -lh output/output.mp4

          echo
          echo "=== Output type ==="
          file output/output.mp4


      # -------------------------------------------------------
      # 15. Upload MP4
      # -------------------------------------------------------
      - name: Upload rendered video artifact
        uses: actions/upload-artifact@v7
        with:
          name: rendered-video
          path: output/output.mp4
          retention-days: 1
