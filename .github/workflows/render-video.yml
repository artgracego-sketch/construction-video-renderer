name: Render 9:16 Video

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Google Drive test file ID"
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    name: FFmpeg Render
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install imageio-ffmpeg requests

      - name: Check Python syntax
        run: |
          set -euxo pipefail

          python3 -m py_compile renderer/render_video.py
          python3 -m py_compile scripts/download_drive_file.py
          python3 -m py_compile scripts/list_drive_files.py

          echo "Python syntax check passed."

      - name: Verify Google OAuth secrets
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euxo pipefail

          test -n "$GOOGLE_CLIENT_ID"
          test -n "$GOOGLE_CLIENT_SECRET"
          test -n "$GOOGLE_REFRESH_TOKEN"

          echo "Google OAuth secrets are available."

      - name: Show repository files
        run: |
          set -euxo pipefail

          echo "=== Repository ==="
          find . -maxdepth 3 -type f | sort

          echo
          echo "=== Input ==="
          ls -lah input || true

          echo
          echo "=== Renderer ==="
          ls -lah renderer || true

          echo
          echo "=== Scripts ==="
          ls -lah scripts || true

      - name: Verify local test files
        run: |
          set -euxo pipefail

          test -f input/photo.png
          test -f input/narration.wav
          test -f input/subtitle.srt

          echo "Local test files exist."

      - name: List Google Drive files
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euxo pipefail

          python3 scripts/list_drive_files.py

      - name: Download Google Drive test file
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FILE_ID: ${{ inputs.drive_file_id }}
        run: |
          set -euxo pipefail

          python3 scripts/download_drive_file.py

      - name: Check downloaded Drive file
        run: |
          set -euxo pipefail

          test -f work/drive_input

          echo "Downloaded file:"
          ls -lh work/drive_input

          echo
          echo "File type:"
          file work/drive_input

      - name: Inspect local input files
        run: |
          set -euxo pipefail

          echo "=== Image ==="
          file input/photo.png

          echo
          echo "=== Audio ==="
          file input/narration.wav

          echo
          echo "=== Subtitle ==="
          file input/subtitle.srt

      - name: Verify FFmpeg binary
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          import subprocess
          import imageio_ffmpeg

          ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()

          print("FFmpeg executable:")
          print(ffmpeg)

          result = subprocess.run(
              [ffmpeg, "-version"],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              check=True,
          )

          print()
          print(result.stdout.splitlines()[0])
          PY

      - name: FFmpeg Render
        run: |
          set -euxo pipefail

          python3 renderer/render_video.py

      - name: Inspect output
        run: |
          set -euxo pipefail

          test -f output/output.mp4

          echo "=== Output file ==="
          ls -lh output/output.mp4

      - name: Upload rendered video artifact
        uses: actions/upload-artifact@v7
        with:
          name: rendered-video
          path: output/output.mp4
          retention-days: 1
