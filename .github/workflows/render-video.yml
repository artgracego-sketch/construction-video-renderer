name: Render 9:16 Video

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Google Drive test file ID"
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    name: FFmpeg Render
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install imageio-ffmpeg requests

      - name: Prepare Google credentials
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          test -n "$GOOGLE_CLIENT_ID"
          test -n "$GOOGLE_CLIENT_SECRET"
          test -n "$GOOGLE_REFRESH_TOKEN"

          echo "Google OAuth secrets are available."

      - name: Download Drive test file
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FILE_ID: ${{ inputs.drive_file_id }}
        run: |
          python3 scripts/download_drive_file.py

      - name: Check downloaded file
        run: |
          set -euxo pipefail

          test -f work/drive_input

          ls -lh work/drive_input

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: drive-test-file
          path: work/drive_input
          retention-days: 1
